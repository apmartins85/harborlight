image: python:3.12-alpine
checkInterval: 15
service:
  type: NodePort
  port: 80
  nodePort: 30080
# Additional HTTP targets, reachable from inside the cluster.
services:
  - name: ntfy notifications
    url: http://ntfy.notifications.svc.cluster.local/v1/health
#  - name: My API
#    url: http://my-api.default.svc.cluster.local:8080/health
dummy:
  enabled: false
  replicas: 1
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 96Mi

# Optional standalone image built from microservices/task-api/Dockerfile.
# Empty image uses the Python runtime and mounted source (no build needed).
taskApi:
  enabled: false
  image: ""
  imagePullPolicy: IfNotPresent
