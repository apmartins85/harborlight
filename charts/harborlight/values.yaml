image: python:3.12-alpine
checkInterval: 15
service:
  type: NodePort
  port: 80
  nodePort: 30080
# Additional HTTP targets, reachable from inside the cluster.
services:
  - name: ntfy notifications
    url: http://ntfy.notifications.svc.cluster.local/v1/health
  - name: IT-Tools
    url: http://it-tools.utilities.svc.cluster.local/
  - name: CyberChef
    url: http://cyberchef.utilities.svc.cluster.local/
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 96Mi

