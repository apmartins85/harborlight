{{- if .Values.dummy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harborlight.name" . }}-dummy
data:
  dummy.py: |
{{ .Files.Get "files/dummy.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harborlight.name" . }}-dummy
spec:
  replicas: {{ .Values.dummy.replicas }}
  selector:
    matchLabels:
      app: {{ include "harborlight.name" . }}-dummy
  template:
    metadata:
      labels:
        app: {{ include "harborlight.name" . }}-dummy
      annotations:
        checksum/source: {{ .Files.Get "files/dummy.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dummy
          image: {{ .Values.image | quote }}
          command: ["python", "-B", "/app/dummy.py"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: {{ include "harborlight.name" . }}-dummy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harborlight.name" . }}-dummy
spec:
  selector:
    app: {{ include "harborlight.name" . }}-dummy
  ports:
    - port: 8080
      targetPort: http
{{- end }}
