# Disposable Killercoda lab: ntfy's cache/auth database uses emptyDir.
fullnameOverride: ntfy
persistence:
  enabled: false
service:
  type: ClusterIP
ntfy:
  authDefaultAccess: read-write
  admin:
    enabled: false
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
